# 生产环境 Nginx 配置：静态托管前端 dist，并把 /api 反向代理到后端
# 部署路径参考：/etc/nginx/conf.d/dorm-repair.conf
server {
    listen       80;
    server_name  _;

    # Vite 构建产物目录
    root  /opt/dorm-repair/frontend/dist;
    index index.html;

    # 与后端 multipart 的 max-request-size(30MB) 对齐，满足图片上传
    client_max_body_size 30m;

    # 前端为 Vue SPA，非静态资源一律回落到 index.html（history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端。注意 proxy_pass 结尾不要加 "/"，
    # 否则会剥掉 /api 前缀，导致后端 404（后端接口本身带 /api）。
    location /api/ {
        proxy_pass http://127.0.0.1:1026;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件时放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
